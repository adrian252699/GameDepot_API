spring.application.name=GameDepotAPI

server.port=8081

spring.mvc.hiddenmethod.filter.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

spring.datasource.url=jdbc:mysql://localhost:3306/game_depot
spring.datasource.username=root
spring.datasource.password=itson
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600000
